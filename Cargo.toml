[package]
name = "agent-tui"
version = "0.1.0"
edition = "2021"
description = "Windows-native multi-agent TUI console (agents-complete + vt100)"
license = "MIT"

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[[example]]
name = "pty_probe"
path = "examples/pty_probe.rs"

[[example]]
name = "terminal_exit_probe"
path = "examples/terminal_exit_probe.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
tui-term = "0.3"
vt100 = "0.16"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
